name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install xcodegen and dmgbuild
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages dmgbuild
      - name: Unit tests
        run: |
          xcodegen generate --quiet
          mkdir -p build
          set -o pipefail
          xcodebuild -project Cable.xcodeproj -scheme Cable -destination 'platform=macOS' \
            -derivedDataPath build/test CODE_SIGN_IDENTITY=- test 2>&1 | tee build/test.log | grep -E "error:|Test run|TEST" || true
          grep -q "TEST SUCCEEDED" build/test.log
      - name: Build ad-hoc DMG
        run: scripts/release.sh "0.0.0-ci" "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Cable-ci-dmg
          path: dist/*.dmg
          retention-days: 7
